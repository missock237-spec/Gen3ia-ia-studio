<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hors ligne — Gen3ia AI Studio</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #070a12;
        color: #fff;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      .card {
        max-width: 460px;
        width: 100%;
        text-align: center;
        padding: 40px 32px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 24px;
        background: #0d1220;
      }
      .badge {
        display: inline-block;
        padding: 6px 12px;
        border-radius: 10px;
        border: 1px solid rgba(167, 139, 250, 0.4);
        background: rgba(124, 58, 237, 0.15);
        color: #c4b5fd;
        font-size: 12px;
        letter-spacing: 0.2em;
        text-transform: uppercase;
      }
      h1 { margin: 20px 0 8px; font-size: 22px; }
      p { margin: 0; color: rgba(255, 255, 255, 0.6); font-size: 14px; line-height: 1.7; }
      button {
        margin-top: 24px;
        padding: 12px 24px;
        border: 0;
        border-radius: 12px;
        background: #7c3aed;
        color: #fff;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
      }
      button:hover { background: #8b5cf6; }
    </style>
  </head>
  <body>
    <div class="card">
      <span class="badge">Gen3ia</span>
      <h1>Vous êtes hors ligne</h1>
      <p>
        Gen3ia AI Studio nécessite une connexion Internet pour faire tourner
        ses agents. Vérifiez votre réseau puis réessayez.
      </p>
      <button onclick="location.reload()">Réessayer</button>
    </div>
  </body>
</html>
