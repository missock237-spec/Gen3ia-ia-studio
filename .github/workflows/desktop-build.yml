name: Build desktop apps

# Construit les installateurs PC de Gen3ia AI Studio :
# - Windows : installeur NSIS + portable (.exe)
# - Linux   : AppImage + paquet .deb
# Declenchement : manuel, ou push d'un tag desktop-v* (publication en Release).

on:
  workflow_dispatch:
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --win nsis portable
          - os: ubuntu-latest
            args: --linux AppImage deb
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build installers
        run: npx electron-builder ${{ matrix.args }}
        env:
          GEN3IA_DESKTOP_VERSION: ${{ github.ref_name }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gen3ia-desktop-${{ matrix.os }}
          if-no-files-found: error
          path: |
            desktop/dist/*.exe
            desktop/dist/*.AppImage
            desktop/dist/*.deb

      - name: Publish release (tag desktop-v*)
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/dist/*.exe
            desktop/dist/*.AppImage
            desktop/dist/*.deb
          generate_release_notes: true
